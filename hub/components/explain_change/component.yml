# explain_change — data-native reasoning: explain WHY a metric moved by decomposing the change
# across dimensions and time. Outputs a `narrative` (the stdlib text block added for this component).
#
# ADDITIVITY (Phase 2: enforced at compile time). The `metric_additive` precondition is now
# *evaluated* against the bound MDL by the ContextLoader: the profile fails to compile unless the
# semantic layer declares at least one additive metric (and `metric_additive` is unanswerable —
# a loud-fail — on a project with no declared metric at all). This is the existential guarantee.
# The per-metric check stays at runtime: `additivity_guard` (and the output caveat below) confirm
# the *specific* metric the user asks to decompose is additive, since the metric is a runtime input.

id: explain_change
verb: explain_change
type: analytical
realization_kind: skill

binding_mode: runtime_selected
context_requirements:
  - "a wren project with an additive metric plus a time dimension and a groupable dimension"
context_precondition:
  - { predicate: metric_additive }
  - { predicate: has_time_dimension }
  - { predicate: has_groupable_dimension }

params: []

llm_steps:
  - { name: plan_decomposition, tier: strong, prompt_ref: steps/plan_decomposition.md,
      produces: decomposition_plan }
  - { name: synthesize_drivers, tier: strong, prompt_ref: steps/synthesize_drivers.md,
      consumes: [decomposition_plan], produces: driver_explanation }
trigger: { kind: one_shot }
guardrails:
  - { name: read_only_execution, locked: true }
  - { name: drill_depth_limit, overridable: true, threshold: 3 }
  - { name: additivity_guard, locked: true }        # compile-time existence + runtime per-metric (see header)
  - { name: artifact_write, locked: true, scope: "." }

required_capabilities:
  - sql_execution:read_only
  - render_contract
  - artifact_write
  - llm:strong
borrowed_actions: []

effect:
  render_blocks:
    - type: narrative
      fields: { title: "string?", text: string }
  outcome:
    kind: none

eval:
  template_ref: eval/
  metrics: [driver_correctness, additivity_guard]

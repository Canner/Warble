# bootstrap_mdl — the litmus Constitutive component (components-catalog.md #8).
#
# The first component that INVERTS `skill = f(Context)`: its OUTPUT is the Context. Where analytical /
# assertive / mutating-data components read an existing MDL, a constitutive component reads a RAW
# source and PRODUCES the MDL. That inversion shows up in exactly two places, both additive:
#   - the precondition reads raw-data-shape (`source_introspectable`), not an existing-MDL predicate;
#   - the outcome reuses the +Mutating `mutation` arm with `target: context` (not `target: data`) —
#     so it rides the same gated lifecycle as edit_pipeline, differentiated by the target facet, and
#     the SPINE grows by vocabulary only (the two raw-shape predicates), never a new outcome arm.
#
# The third enforcement point lands here: `context_write_authz` (scope `models/`) — writing the
# git-authoritative Context is neither production data-write nor throwaway artifact-write. A generic
# sandbox sees "a file was written"; it cannot know that file is the MDL every downstream component
# reads. There is deliberately NO blast_radius here: there is no existing lineage to gate — the
# component is creating it.

# ── identity & type [spine] ──
id: bootstrap_mdl
verb: bootstrap_mdl
type: constitutive
realization_kind: gated-tool

# ── Context requirements (INVERTED: raw input shape, not existing MDL) [spine] ──
binding_mode: pinned
context_requirements:
  - "a raw source whose schema can be introspected (tables + columns + types)"
context_precondition:
  # Raw-shape, not MDL-shape: the bound thing is a RAW source, and its schema must be readable or a
  # bootstrap cannot be proposed. A Context that cannot probe a raw source (an MDL-only adapter)
  # makes this UNANSWERABLE — a loud-fail, never a silent guess (core D2 pattern).
  - { predicate: source_introspectable }

# ── inputs the profile supplies ──
params:
  - { name: source, bind: required }               # the pinned raw source this component may bootstrap
  - { name: connection, source: runtime-injected } # not in git (§14)
  - { name: model_binding, source: runtime-injected }

# ── behavior defaults [spine] ──
llm_steps:
  # Introspect the raw schema (cheap), then draft the MDL as a DIFF (strong). The gated-tool lifecycle
  # (dry-run → gate → approve → apply → rollback) lives in the back-end, reused from +Mutating.
  - { name: introspect_source, tier: cheap, prompt_ref: steps/introspect_source.md,
      produces: raw_schema }
  - { name: draft_mdl, tier: strong, prompt_ref: steps/draft_mdl.md,
      consumes: [raw_schema], produces: mdl_diff }
trigger: { kind: one_shot }
guardrails:
  # The constitutive safety floor — all locked; a profile cannot weaken them (component-spec §3/§4.7).
  - { name: must_dry_run, locked: true }             # propose a diff first; never blind-write
  - { name: human_approval, locked: true }           # apply gated on a human — headless loud-fails
  - { name: no_silent_overwrite, locked: true }      # never clobber existing Context without surfacing it
  - { name: context_write_authz, locked: true,       # the 3rd enforcement point: scoped Context write
      scope: "models/" }                             # bootstrap_mdl may write ONLY models/, nothing else
  - { name: rollback_available, locked: true }       # a git checkpoint before apply (borrowed VCS)

required_capabilities:
  - schema_introspection      # borrowed (dlt/wren): read the raw source's schema
  - context_write_authz       # the 3rd enforcement point: scoped write to git-authoritative Context
  - version_control           # borrowed (git): checkpoint + rollback
  - human_approval            # LOCKED gate → resolves fail on a target with no human (headless)
  - llm:cheap                 # introspect_source tier
  - llm:strong                # draft_mdl tier
borrowed_actions: []

# ── output [effect] — reuses the +Mutating `mutation` arm, differentiated by `target: context` ──
effect:
  render_blocks: [diff]       # the proposed Context write, as a unified diff (same facet as edit_pipeline)
  outcome:
    kind: mutation            # NOT a new arm: reuses +Mutating (spine stays 4-valued)
    target: context           # the facet that distinguishes constitutive (context) from data (4a)
    change_type: mdl_bootstrap

# ── evaluation [spine] ──
eval:
  template_ref: eval/
  metrics: [schema_fidelity, metric_soundness]

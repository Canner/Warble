# Opens/updates the release pull request from conventional commits on `main`, and tags +
# publishes the GitHub Release when that PR is merged. See RELEASING.md for the two-component
# shape (workspace "." + the independently-versioned "ir-spec" component) and why the token
# below is not the default GITHUB_TOKEN.
name: Release Please

on:
  push:
    branches:
      - main

permissions:
  contents: write
  pull-requests: write

jobs:
  release-please:
    if: ${{ github.repository == 'Canner/Warble' }}
    runs-on: ubuntu-latest
    outputs:
      warble--release_created: ${{ steps.release.outputs['.--release_created'] }}
      warble--tag_name: ${{ steps.release.outputs['.--tag_name'] }}
      warble--version: ${{ steps.release.outputs['.--version'] }}
      ir-spec--release_created: ${{ steps.release.outputs['packages/ir-spec--release_created'] }}
      ir-spec--tag_name: ${{ steps.release.outputs['packages/ir-spec--tag_name'] }}
      ir-spec--version: ${{ steps.release.outputs['packages/ir-spec--version'] }}
    steps:
      - uses: googleapis/release-please-action@v4
        id: release
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json
          # No token is passed here on purpose, so this workflow needs no repository secret.
          #
          # The consequence is that the release PR is opened as github-actions[bot], and GitHub
          # will not fire pull_request-triggered workflows for it -- a deliberate recursion
          # guard. CI still gates the release PR, by a different route: ci.yml also triggers on
          # pushes to `release-please--**`, and a check run attaches to a commit SHA, so the run
          # against the release branch head appears on the pull request. See the comment beside
          # that branch pattern in ci.yml for why this is preferred over a PAT here.

  # No publish-* jobs are wired to this workflow's outputs yet -- publishing crates.io/npm
  # artifacts on release is a separate phase of work, tracked apart from this one.

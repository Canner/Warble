# Opens/updates the release pull request from conventional commits on `main`, and tags +
# publishes the GitHub Release when that PR is merged. release-please manages a single component,
# the workspace ("."); `packages/ir-spec` is deliberately not a release-please component -- its
# version is a hand-maintained projection of the IR, not something computed from commits. See
# RELEASING.md ("ir-spec version discipline") for why, and for the rule that keeps it correct.
name: Release Please

on:
  push:
    branches:
      - main
  # The manual pre-publish path lives here rather than on publish-warble-ir-spec.yml because
  # both registries validate the workflow filename from the OIDC `workflow_ref` claim, which
  # names the *top-level* workflow -- a reusable workflow invoked by `workflow_call` never
  # appears there. Each package also accepts only one trusted publisher, so a second entry point
  # with a different filename cannot be registered alongside this one. Keeping both paths inside
  # this file means one registration per package, naming release-please.yml, covers both.
  workflow_dispatch:
    inputs:
      publish_ir_spec:
        description: >-
          Publish @warble/ir-spec from the current ref without waiting for a release. Use this to
          give the spec package registry lead time ahead of merging a release PR -- see
          RELEASING.md on minimum-release-age. Idempotent: skips if the declared version is
          already on the registry.
        type: boolean
        default: false
      recover_npm_dispatchers_tag:
        description: Existing published stable release tag whose dispatcher publication should be retried.
        type: string
        default: ""
      release_candidate:
        description: >-
          Cut the next release candidate (vX.Y.Z-rc.N) for the version the open release PR
          proposes, without merging that PR, and publish it to every prerelease channel. See
          RELEASING.md, "Release candidates". Run from main, with the other inputs left unset.
        type: boolean
        default: false
      rc_publish_crates:
        description: >-
          With release_candidate, also publish the candidate's crates to crates.io. Off by default
          because a crates.io version can only be yanked, never deleted.
        type: boolean
        default: false

permissions:
  contents: write
  pull-requests: write

jobs:
  validate-dispatcher-recovery:
    if: github.repository == 'Canner/Warble' && github.event_name == 'workflow_dispatch' && inputs.recover_npm_dispatchers_tag != '' && !inputs.release_candidate
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      ref: ${{ steps.validate.outputs.ref }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
      - name: Validate published release and exact package tuple
        id: validate
        env:
          GH_TOKEN: ${{ github.token }}
          RECOVERY_TAG: ${{ inputs.recover_npm_dispatchers_tag }}
          PUBLISH_IR_SPEC: ${{ inputs.publish_ir_spec }}
          RECOVERY_WORKFLOW_REF: ${{ github.ref }}
        run: node .github/scripts/validate-dispatcher-recovery.mjs

  recover-npm-dispatchers:
    needs: validate-dispatcher-recovery
    permissions:
      contents: read
      id-token: write
    uses: ./.github/workflows/publish-warble-npm.yml
    with:
      ref: ${{ needs.validate-dispatcher-recovery.outputs.ref }}
    secrets: inherit

  release-please:
    if: ${{ github.repository == 'Canner/Warble' && github.event_name == 'push' }}
    runs-on: ubuntu-latest
    outputs:
      # The root component's outputs are UNPREFIXED. release-please-action only prefixes
      # non-root paths -- `if (path === '.') core.setOutput(key, value)` in its own source -- so
      # a '.--release_created' read is always empty, and every job gated on it is silently
      # skipped on a green run.
      #
      # The ir-spec--* mappings below are vestigial: `packages/ir-spec` is not declared under
      # `packages` in release-please-config.json (see the top-of-file comment), so
      # release-please never produces a 'packages/ir-spec--*' key and these three always resolve
      # to an empty string. They are kept, rather than deleted, only because publish-ir-spec's
      # `if:`/`ref:` below reference them as a harmless first choice that falls through to
      # warble--* -- see that job's own comment.
      warble--release_created: ${{ steps.release.outputs.release_created }}
      warble--tag_name: ${{ steps.release.outputs.tag_name }}
      warble--version: ${{ steps.release.outputs.version }}
      ir-spec--release_created: ${{ steps.release.outputs['packages/ir-spec--release_created'] }}
      ir-spec--tag_name: ${{ steps.release.outputs['packages/ir-spec--tag_name'] }}
      ir-spec--version: ${{ steps.release.outputs['packages/ir-spec--version'] }}
    steps:
      - uses: googleapis/release-please-action@v4
        id: release
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json
          # GitHub's workflow-recursion guard is scoped to the *token* that performs an action,
          # not to the *event* it produces: nothing authored by the default GITHUB_TOKEN -- a
          # push, a tag, a pull request -- will ever trigger another workflow run (only
          # workflow_dispatch/repository_dispatch are exempt). Without a token here, the release
          # PR is opened as github-actions[bot] and ci.yml's pull_request trigger never fires on
          # it -- the one PR whose entire job is to be correct would be the one PR nothing
          # checks. The tag this action creates on merge has the same problem: cargo-dist's
          # tag-triggered release workflow would never run either.
          #
          # RELEASE_PLEASE_TOKEN is a repository secret provisioned outside this workflow (a
          # human owns creating and rotating it; a GitHub App installation token is preferred
          # over a classic PAT so it doesn't lapse silently). The `||` fallback is load-bearing,
          # not decorative. The action declares `token` as optional with a `github.token` default, but an
          # explicitly-supplied empty value overrides that default rather than falling back to it,
          # so naming the secret with no `||` would break the workflow outright the moment the
          # secret went missing -- which is why the fallback names GITHUB_TOKEN by hand. The cost is
          # that a lapsed secret degrades quietly: release-please keeps opening the release PR, just
          # with nothing checking it. Read the health of this credential from whether the release PR
          # carries checks, never from this workflow being green.
          token: ${{ secrets.RELEASE_PLEASE_TOKEN || secrets.GITHUB_TOKEN }}

  # The three publish-* jobs below are reusable workflows (`workflow_call` only -- see each
  # file's own header comment), so they can only run when explicitly invoked from here. Each is
  # gated on the release-please job's own per-component outputs above, which are themselves only
  # non-empty when `release-please` ran on Canner/Warble (see that job's `if`) -- a fork, or a
  # push to `main` that wasn't a release-PR merge, never reaches any of these three jobs.
  #
  # publish-crates and publish-ir-spec are independent of each other: a failure in one group
  # must not leave the other unrecoverable. publish-npm-dispatchers additionally needs
  # publish-ir-spec to have succeeded -- not merely been gated the same way -- because
  # @warble/ir-spec must actually be published and resolvable before either dispatcher (which
  # peer-depends on it) publishes.
  publish-crates:
    needs: release-please
    if: needs.release-please.outputs.warble--release_created == 'true'
    # A reusable workflow's own `permissions:` block (in publish-warble-crates.yml) can only
    # narrow what the caller grants here, never escalate past it -- job-level `permissions` below
    # replaces (not merges with) this workflow's top-level `contents: write, pull-requests:
    # write`, so `id-token: write` must be re-granted explicitly here for the crates.io OIDC
    # trusted-publishing step to get a real token instead of silently running with none.
    permissions:
      contents: read
      id-token: write
    uses: ./.github/workflows/publish-warble-crates.yml
    with:
      ref: ${{ needs.release-please.outputs.warble--tag_name }}
    secrets: inherit

  # Runs on every workspace release, not only one that changed the IR -- @warble/ir-spec must
  # publish whenever its currently-declared version is absent from the registry, not only on a
  # release that moved the IR. A workspace-only release (dispatchers
  # bump, ir-spec's package.json unchanged) still runs this job so the idempotent presence check
  # inside publish-warble-ir-spec.yml can catch a version that a prior run failed to publish.
  #
  # The `ir-spec--release_created` arm of the `if:` below and the `ir-spec--tag_name` fallback in
  # `ref:` are dead in practice: `packages/ir-spec` is not a release-please component (see the
  # release-please job's `outputs:` comment above), so both always evaluate to '' / false and every
  # real run takes the warble--* branch, whose checked-out packages/ir-spec/package.json reflects
  # whatever version was set by hand per RELEASING.md ("ir-spec version discipline"). They are left
  # in place, rather than removed, because they cost nothing and would only start mattering again
  # if `packages/ir-spec` were ever re-declared as its own component -- which the current design
  # deliberately avoids.
  publish-ir-spec:
    needs: release-please
    # `!cancelled()` rather than a bare condition: on a manual dispatch the release-please job
    # above is skipped, and a dependent job whose `needs` was skipped is skipped too unless the
    # condition tolerates it.
    if: |
      !cancelled() && github.repository == 'Canner/Warble' && (
        (github.event_name == 'workflow_dispatch' && inputs.publish_ir_spec && inputs.recover_npm_dispatchers_tag == '' && !inputs.release_candidate) ||
        needs.release-please.outputs.warble--release_created == 'true' ||
        needs.release-please.outputs.ir-spec--release_created == 'true'
      )
    permissions:
      contents: read
      # npm trusted publishing mints an OIDC token in the called workflow, and a reusable
      # workflow can only narrow the permissions its caller granted. Without this the callee's
      # own id-token: write has nothing to inherit from.
      id-token: write
    uses: ./.github/workflows/publish-warble-ir-spec.yml
    with:
      ref: ${{ needs.release-please.outputs.ir-spec--tag_name || needs.release-please.outputs.warble--tag_name || github.ref }}
    secrets: inherit

  # Gated on the "." (workspace) component's release_created, since that is the only component
  # and it owns both dispatcher packages. Because publish-ir-spec's own gate
  # (above) is a superset of this condition, publish-ir-spec is guaranteed to actually run
  # (never silently "skipped") whenever this job's condition is true, so `needs.publish-ir-spec.
  # result == 'success'` below is a meaningful check rather than one that vacuously blocks on a
  # skip.
  publish-npm-dispatchers:
    needs: [release-please, publish-ir-spec]
    if: |
      needs.release-please.outputs.warble--release_created == 'true' &&
      needs.publish-ir-spec.result == 'success'
    permissions:
      contents: read
      # npm trusted publishing mints an OIDC token in the called workflow, and a reusable
      # workflow can only narrow the permissions its caller granted. Without this the callee's
      # own id-token: write has nothing to inherit from.
      id-token: write
    uses: ./.github/workflows/publish-warble-npm.yml
    with:
      ref: ${{ needs.release-please.outputs.warble--tag_name }}
    secrets: inherit

  # @warble/cli peer-depends on @warble/ir-spec the same way the two TS dispatchers do (see
  # cli/npm-metadata.json), so it needs the same publish-ir-spec-first ordering and the same
  # workspace-component gate as publish-npm-dispatchers above -- it is owned by the "."
  # component, the only one release-please manages.
  publish-cli:
    needs: [release-please, publish-ir-spec]
    if: |
      needs.release-please.outputs.warble--release_created == 'true' &&
      needs.publish-ir-spec.result == 'success'
    permissions:
      contents: read
      # npm trusted publishing mints an OIDC token in the called workflow, and a reusable
      # workflow can only narrow the permissions its caller granted. Without this the callee's
      # own id-token: write has nothing to inherit from.
      id-token: write
    uses: ./.github/workflows/publish-warble-cli.yml
    with:
      ref: ${{ needs.release-please.outputs.warble--tag_name }}
    secrets: inherit

  # Attaches the Hub component library (hub/components/) to the same release as a versioned,
  # checksummed archive -- see publish-warble-hub.yml's own header comment for the asset names
  # and layout contract. Gated on the "." (workspace) component only, the same as publish-cli:
  # the hub tarball is not independently versioned and ships with every workspace release.
  publish-hub-asset:
    needs: release-please
    if: needs.release-please.outputs.warble--release_created == 'true'
    permissions:
      # `gh release upload` needs write access to the release; no registry/OIDC credential is
      # involved, so unlike the OIDC-publishing jobs above, no `id-token: write` is needed here.
      contents: write
    uses: ./.github/workflows/publish-warble-hub.yml
    with:
      ref: ${{ needs.release-please.outputs.warble--tag_name }}

  # Release candidates: a manual, repeatable pre-release of what the open release PR would ship,
  # so a consumer can test it without the release PR being merged -- merging is what makes a
  # stable version, and doing that after every change is what this path exists to avoid.
  #
  # The candidate is main's HEAD with every release-please extra-files surface set to
  # X.Y.Z-rc.N, where X.Y.Z is the release PR's proposed version and N follows the highest
  # existing vX.Y.Z-rc.* tag. That version commit is reachable only from its tag; it never lands
  # on main, so .release-please-manifest.json, CHANGELOG.md and release-please's own next
  # computation are untouched.
  #
  # It enters through this file for the same reason the other manual paths do: crates.io and npm
  # accept exactly one trusted publisher per package, and it names release-please.yml.
  release-candidate:
    if: github.repository == 'Canner/Warble' && github.event_name == 'workflow_dispatch' && inputs.release_candidate
    runs-on: ubuntu-latest
    # Two overlapping runs would both compute the same rc.N.
    concurrency:
      group: warble-release-candidate
      cancel-in-progress: false
    permissions:
      contents: write
      pull-requests: read
    outputs:
      tag: ${{ steps.prepare.outputs.tag }}
    steps:
      # The tag must be pushed with this token, not GITHUB_TOKEN: a tag pushed by the default
      # token never triggers v-release.yml (see the `token:` comment on the release-please job),
      # and the candidate would sit as a draft with no binaries while @warble/cli waits on it.
      - name: Require the release token
        env:
          RELEASE_PLEASE_TOKEN: ${{ secrets.RELEASE_PLEASE_TOKEN }}
        run: |
          if [ -z "$RELEASE_PLEASE_TOKEN" ]; then
            echo "::error::RELEASE_PLEASE_TOKEN is not set; a candidate tag pushed without it would never start the binary release." >&2
            exit 1
          fi
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          token: ${{ secrets.RELEASE_PLEASE_TOKEN }}
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
      - uses: extractions/setup-just@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Set every release surface to the next candidate version
        id: prepare
        env:
          GH_TOKEN: ${{ github.token }}
          WORKFLOW_REF: ${{ github.ref }}
          PUBLISH_IR_SPEC: ${{ inputs.publish_ir_spec }}
          RECOVERY_TAG: ${{ inputs.recover_npm_dispatchers_tag }}
        run: node .github/scripts/prepare-release-candidate.mjs
      - name: Check the candidate tree is releasable
        run: |
          set -euo pipefail
          cargo metadata --locked --format-version 1 > /dev/null
          just publish-check
      - name: Tag the candidate and open its draft prerelease
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.prepare.outputs.tag }}
          PREVIOUS_TAG: ${{ steps.prepare.outputs.previous_tag }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit --quiet --all --message "chore(release): warble ${TAG}"
          git tag --annotate "$TAG" --message "warble ${TAG}"
          git push origin "refs/tags/${TAG}"
          # v-release.yml (create-release = false) uploads into an existing draft and undrafts it,
          # exactly as it does for release-please's stable drafts; --prerelease keeps the candidate
          # from ever becoming the repository's latest release.
          gh release create "$TAG" --repo "$GITHUB_REPOSITORY" --verify-tag --draft --prerelease \
            --title "$TAG" --generate-notes --notes-start-tag "$PREVIOUS_TAG"

  # The same reusable publish workflows as a stable release, against the candidate tag. Ordering
  # matches the stable jobs above: the IR spec is confirmed on the registry before anything that
  # peer-depends on it. npm packages go to the `next` dist-tag, so `npm install @warble/cli` keeps
  # resolving the last stable release.
  rc-publish-hub-asset:
    needs: release-candidate
    permissions:
      contents: write
    uses: ./.github/workflows/publish-warble-hub.yml
    with:
      ref: ${{ needs.release-candidate.outputs.tag }}

  rc-publish-ir-spec:
    needs: release-candidate
    permissions:
      contents: read
      id-token: write
    uses: ./.github/workflows/publish-warble-ir-spec.yml
    with:
      ref: ${{ needs.release-candidate.outputs.tag }}
    secrets: inherit

  rc-publish-npm-dispatchers:
    needs: [release-candidate, rc-publish-ir-spec]
    permissions:
      contents: read
      id-token: write
    uses: ./.github/workflows/publish-warble-npm.yml
    with:
      ref: ${{ needs.release-candidate.outputs.tag }}
      npm_dist_tag: next
    secrets: inherit

  rc-publish-cli:
    needs: [release-candidate, rc-publish-ir-spec]
    permissions:
      contents: read
      id-token: write
    uses: ./.github/workflows/publish-warble-cli.yml
    with:
      ref: ${{ needs.release-candidate.outputs.tag }}
      npm_dist_tag: next
    secrets: inherit

  rc-publish-crates:
    needs: release-candidate
    if: inputs.rc_publish_crates
    permissions:
      contents: read
      id-token: write
    uses: ./.github/workflows/publish-warble-crates.yml
    with:
      ref: ${{ needs.release-candidate.outputs.tag }}
    secrets: inherit

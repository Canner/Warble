# Warble build CI — the G-line every PR and every push to `main` must pass.
#
# Single source of truth: every step below calls a `justfile` recipe rather than re-transcribing
# its commands, so "green locally" and "green in CI" always mean the same thing. If a recipe
# changes, this workflow's behavior changes with it automatically.
#
# No Actions secret is required anywhere in this workflow — fork PRs (which never receive
# secrets) must be able to run it in full. `just doc` and `just publish-check` need outbound
# network access to the crates.io registry, but no credentials.
#
# Platform matrix is ubuntu-latest + ubuntu-24.04-arm, deliberately. arm64 Linux is one of the
# release targets the binary-release workflow builds for, so CI needs to actually compile and
# test on that architecture rather than only planning for it. `macos-latest` is deliberately
# NOT added here yet — this is a considered omission, not an oversight: macOS runners bill at a
# multiple of Linux minutes on a private repo, which isn't worth paying for before this repo is
# public. Re-adding it is follow-up work for public-snapshot time, when macOS minutes are free
# and the cost reason disappears. The matrices below are kept as matrices (rather than a bare
# `runs-on`) so adding a platform back is a one-line change.
#
# Windows is likewise absent from CI: whether Warble ships Windows binaries is a release-tooling
# decision that hasn't been made yet (note the release-binary step and its artifact path would
# need `.exe` handling too).
#
# Third-party actions use stable upstream major/release tags where available; dtolnay/rust-toolchain
# uses its upstream `@stable` channel. These refs are deliberately mutable so compatible maintenance
# and security updates arrive automatically. Major-tag changes remain explicit review events, while
# the Rust version follows the stable channel.

name: ci

on:
  pull_request:
  push:
    branches:
      - main

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  # Don't cancel an in-flight run on `main`: two rapid pushes there would otherwise leave the
  # first commit with no completed CI record. PR branches still get the fast-cancel behavior.
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  # cargo fmt --check, clippy -D warnings, cargo test, cargo build, and the release binary (needed
  # by the `ts` job below so the TS back-end's render tests can run against a real binary instead
  # of skipping).
  rust:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, ubuntu-24.04-arm]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
      - uses: extractions/setup-just@v4

      - name: just lint (cargo fmt --check + clippy --workspace --locked -D warnings)
        run: just lint
      - name: just test (cargo test --workspace --locked)
        run: just test
      - name: just build (cargo build --workspace --locked)
        run: just build
      - name: just release (release binary, for the TS render tests)
        run: just release

      - uses: actions/upload-artifact@v7
        with:
          name: warble-release-${{ matrix.os }}
          path: target/release/warble
          if-no-files-found: error
          retention-days: 1

  # Rustdoc lint gate. Kept as its own job because `just doc` deliberately builds into
  # a fresh temp CARGO_TARGET_DIR (dodges a stale-artifact false positive) rather than the repo's
  # `target/`, so it can't reuse the `target/` half of the cache below — see the PR description
  # for why that's an accepted tradeoff rather than a reason to change the recipe.
  doc:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: extractions/setup-just@v4
      - name: just doc (rustdoc -D warnings)
        run: just doc

  # Structural pre-publish checks for all seven crates.io-bound crates (handed over from the same
  # release-prep work as `doc` above).
  publish-check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: extractions/setup-just@v4
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
      - name: just publish-check
        run: just publish-check

  # Validates the workflow files themselves. Nothing else here does: a workflow is only parsed by
  # GitHub when it runs, so a file that is valid YAML but an invalid workflow passes every check
  # and then fails at the moment it matters. That happened -- an expression written inside a
  # workflow_call input's `description`, where no context exists, made GitHub reject
  # release-please.yml outright: no jobs, no logs, no annotations, just a red run on main.
  #
  # shellcheck integration is off. It only reports style findings in v-release.yml, which
  # cargo-dist generates and its own `plan` job refuses to let us edit.
  workflows:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - name: actionlint
        run: |
          set -euo pipefail
          bash <(curl -fsSL https://raw.githubusercontent.com/rhysd/actionlint/main/scripts/download-actionlint.bash)
          ./actionlint -shellcheck=

  # TS back-ends (dispatcher/claude-agent-sdk + dispatcher/codex-local) — separate npm packages,
  # not in the Cargo workspace. Depends on `rust` for the release binary so the Agent SDK render
  # tests (which shell out to `target/release/warble render`) actually execute instead of skipping.
  ts:
    needs: rust
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, ubuntu-24.04-arm]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          # Every lockfile this job runs `npm ci` against, including the eval package's --
          # a lockfile missing from the key is a cache that never invalidates when that
          # package's dependencies change.
          cache-dependency-path: |
            dispatcher/claude-agent-sdk/package-lock.json
            dispatcher/codex-local/package-lock.json
            eval/bird-interact/package-lock.json
      - uses: extractions/setup-just@v4

      - uses: actions/download-artifact@v8
        with:
          name: warble-release-${{ matrix.os }}
          path: target/release
      - run: chmod +x target/release/warble

      - name: just install-ts (npm ci)
        run: just install-ts
      - name: just lint-ts (tsc --strict typecheck)
        run: just lint-ts
      - name: just test-ts (node:test, including render tests against the release binary)
        run: just test-ts
      - name: just build-ts (tsup)
        run: just build-ts

      - name: just install-codex-ts (npm ci)
        run: just install-codex-ts
      - name: just lint-codex-ts (tsc --strict typecheck)
        run: just lint-codex-ts
      - name: just test-codex-ts (node:test; fake executable/MCP only)
        run: just test-codex-ts
      - name: just build-codex-ts (tsup)
        run: just build-codex-ts

      # The third standalone npm package. It was wired into no workflow at all, so its suite and
      # the official BIRD differential ran only when someone remembered -- and every honesty
      # guarantee in that package is enforced by a test rather than by a type.
      #
      # `install-bird-eval` depends on `install-ts build-ts`, so the next step redoes the two
      # sibling steps this job already ran above. That repetition is deliberate and must not be
      # optimized away by stripping the recipe's dependencies: the eval package type-checks
      # against `@warble/claude-agent-sdk`, whose types are its *built* `dist/index.d.ts`, so a
      # developer running `just install-bird-eval` standalone in a clean tree needs the sibling
      # built for `just lint-bird-eval` to pass at all. (Declaring the sibling as a `file:`
      # dependency did not change this: `npm ci` here needs only the sibling's package.json, but
      # the typecheck still needs its `dist/`.) A recipe that works only because CI happened to
      # run something earlier would be a worse trade than one repeated `npm ci` plus one repeated
      # tsup build on a warm npm cache.
      - name: just install-bird-eval (npm ci; re-runs install-ts/build-ts by design, see above)
        run: just install-bird-eval
      - name: just lint-bird-eval (tsc --strict typecheck)
        run: just lint-bird-eval
      # No pinned checkout on a CI runner, so the official differential and the user-simulator
      # model pin skip here by design; they gate the credentialed run, not this job.
      - name: just test-bird-eval (node:test; checkout-pinned oracles skip)
        run: just test-bird-eval
      - name: just build-bird-eval (tsup)
        run: just build-bird-eval

  # Driftwood fixture contract — the pinned-lock, content-addressed-cache and
  # injection-from-base invariants the monitor-freshness eval suite is built on. It lives here
  # rather than in `eval.yml` because it needs no credential and makes no model call: `eval.yml`
  # is manual-dispatch only, so anything cheap enough to run on every PR has to run in this
  # workflow or it never runs at all.
  fixture-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - name: Install uv
        run: curl -LsSf https://astral.sh/uv/install.sh | sh
      - name: Verify fixture lock, cache, and injection-from-base
        run: |
          export PATH="$HOME/.local/bin:$PATH"
          uv run examples/driftwood-wren/test_fixture.py
          uv run examples/driftwood-wren/test_generate.py \
            -k 'stopped_updates_can_inject_from_a_clean_duckdb or injection_from_base_refuses'

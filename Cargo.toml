[workspace]
resolver = "2"
members = ["cli", "core", "bindings/mdl-context", "dispatcher/claude-code-cli", "dispatcher/vercel", "eval/compare", "eval/runner"]

[workspace.package]
version = "0.8.0"
edition = "2021"
license = "Apache-2.0"
repository = "https://github.com/Canner/Warble"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_yaml = "0.9"
serde_json = "1"
sha2 = "0.10"
thiserror = "2"
clap = { version = "4", features = ["derive"] }
tempfile = "3"
url = "2"
# `gzip` (a default feature) is intentionally dropped: it only gates ureq's own
# `Accept-Encoding`/response-decompression handling, and we don't need it here — the Hub
# archive's gzip framing is unpacked by `flate2`/`tar` regardless of what ureq negotiates, and
# GitHub Release asset downloads normally serve identity encoding anyway.
ureq = { version = "3", default-features = false, features = ["rustls"] }
flate2 = "1"
tar = "0.4"
sqlparser = { version = "0.58", features = ["visitor"] }
wren-core-base = "0.1.0"
warble = { path = "core", version = "0.8.0" }
warble-mdl-context = { path = "bindings/mdl-context", version = "0.8.0" }
warble-claude-code = { path = "dispatcher/claude-code-cli", version = "0.8.0" }
warble-vercel = { path = "dispatcher/vercel", version = "0.8.0" }
warble-eval-compare = { path = "eval/compare", version = "0.8.0" }
warble-eval-runner = { path = "eval/runner", version = "0.8.0" }

# The profile that 'dist' will build with
[profile.dist]
inherits = "release"
lto = "thin"

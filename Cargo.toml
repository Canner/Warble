[workspace]
resolver = "2"
members = ["cli", "core", "bindings/mdl-context", "dispatcher/claude-code-cli", "dispatcher/wrenai", "eval/compare", "eval/runner"]

[workspace.package]
version = "0.1.0"
edition = "2021"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_yaml = "0.9"
serde_json = "1"
thiserror = "2"
clap = { version = "4", features = ["derive"] }
tempfile = "3"
sqlparser = { version = "0.58", features = ["visitor"] }
wren-core-base = "0.1.0"
warble = { path = "core" }
warble-mdl-context = { path = "bindings/mdl-context" }
warble-claude-code = { path = "dispatcher/claude-code-cli" }
warble-wrenai = { path = "dispatcher/wrenai" }
warble-eval-compare = { path = "eval/compare" }
warble-eval-runner = { path = "eval/runner" }

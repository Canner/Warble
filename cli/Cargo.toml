[package]
name = "warble-cli"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Warble CLI — compile profiles, dispatch to the Claude Code target, render dashboards, emit manifests, compute blast radius."
repository.workspace = true
readme = "../README.md"
keywords = ["cli", "agent", "llm", "compiler"]
categories = ["command-line-utilities", "development-tools"]

[lib]
name = "warble_cli"
path = "src/lib.rs"

[[bin]]
name = "warble"
path = "src/main.rs"

[dependencies]
warble.workspace = true
warble-mdl-context.workspace = true
warble-claude-code.workspace = true
warble-vercel.workspace = true
serde_yaml.workspace = true
serde_json.workspace = true
clap.workspace = true

[dev-dependencies]
tempfile.workspace = true

[package]
name = "warble-cli"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Warble CLI — compile profiles, dispatch to the Claude Code or Vercel target, render dashboards, emit manifests, run eval."
repository.workspace = true
readme = "../README.md"
keywords = ["cli", "agent", "llm", "compiler"]
categories = ["command-line-utilities", "development-tools"]

[lib]
name = "warble_cli"
path = "src/lib.rs"

[[bin]]
name = "warble"
path = "src/main.rs"

# npm-scope (dist-workspace.toml) + this override give the npm wrapper package @warble/cli,
# instead of dist's default of scoping the crate name (@warble/warble-cli).
[package.metadata.dist]
npm-package = "cli"

[dependencies]
warble.workspace = true
warble-mdl-context.workspace = true
warble-claude-code.workspace = true
warble-vercel.workspace = true
warble-eval-compare.workspace = true
warble-eval-runner.workspace = true
serde_yaml.workspace = true
serde_json.workspace = true
clap.workspace = true

[dev-dependencies]
tempfile.workspace = true

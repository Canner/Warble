# genbi-setup — the agentic onboarding profile (Phase 1 of the setup flow). Connects a NEW data
# source and builds its semantic layer, where genbi-default's components all assume a wren project
# already exists. Both components are deliberately skill-realized with outcome.kind: none (NOT
# constitutive/gated-tool) -- the gated-apply lifecycle requires human_approval, which resolves
# `fail` on a headless target (see docs/spec/capability-model.md §3 and hub/components/bootstrap_mdl
# for the constitutive family this profile deliberately does NOT use). Onboarding side effects
# instead run through guarded Bash (`wren`, connector CLIs) and scoped Write, under the new
# `setup_execution` guardrail -- the 5th enforcement point, name-keyed like `read_only_execution` /
# `artifact_write` / `context_write_authz` (see dispatcher/claude-agent-sdk/src/guardrails.ts).
#
# Bound to a RAW context (see context/binding.yml) since no wren project exists yet at connect time --
# the same precondition inversion examples/bootstrap-agent is built to show, but landing on the skill
# family instead of constitutive: there is no MDL diff to gate here, only onboarding actions.
profile: genbi-setup

context:
  project: ./context/binding.yml

config:
  tier_policy: cost_sensitive

components:
  - use: connect_source
  - use: build_context

# analysis-agent — the Hub's multi-component conformance base.
#
# Exists so the dispatcher back-ends are exercised against a realistic profile that mounts SEVERAL
# Hub components at once, rather than only the single-component examples. Its four components are
# the analytical quartet — explore / answer / render / explain — over one bound semantic layer, so
# a back-end that regresses on agent ordering, tier fan-out, or per-component tool wiring fails
# here rather than downstream in a consumer's own profile.
#
# Deliberately owned by warble and named for what it exercises, not for any product that happens to
# mount the same components: a consuming product's profile lives in that product's repository, and
# this fixture must not follow it there.
profile: analysis-agent
context:
  project: context/binding.yml
components:
  # Mount briefs carry concrete data-access framing only for components that exercise that
  # authority directly. generate_dashboard delegates its panel questions to answer_query and
  # therefore needs no Wren CLI framing of its own. Briefs replace the component's own `brief`
  # wholesale and are assembled into every step's system prompt for that component (see
  # docs/spec/authoring.md, "brief"). Bound to the same jaffle-wren semantic layer as
  # `context/binding.yml`.
  - use: explore_model
    brief: |
      Data access in this deployment goes through the `wren` CLI. Introspect the semantic layer
      with `wren context show` (and, where available, `wren cube list`) to read models, columns,
      relationships, and metrics/cubes — do not assume the schema.
  - use: answer_query
    brief: |
      Data access in this deployment goes through the `wren` CLI. If you need to introspect the
      schema, run `wren context show`. Query the semantic layer with `wren -q -o json -s '<SQL>'`,
      which returns JSON; object-shaped rows are also valid — preserve their values exactly. Never
      hand-write SQL against raw tables outside the model.
  - use: generate_dashboard
  - use: explain_change
    brief: |
      Data access in this deployment goes through the `wren` CLI. Introspect the layer as needed
      with `wren context show`. Run the decomposition queries with `wren -q -o json -s '<SQL>'`.

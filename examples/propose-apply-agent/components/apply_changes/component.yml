# apply_changes — the mutating half of the split (see ../../profile.yml). It has no llm_steps at all:
# the host validates an already-approved proposal, applies one operation at a time, and verifies each
# one, so there is nothing here for a model to decide.
#
# Intentionally a gated-tool requiring `enrichment_apply:deterministic` and `human_approval`. Both are
# safety-critical, and a target with no approval channel must wall-hit on this component rather than
# weaken the requirement to stay dispatchable. That wall-hit is the assertion this component exists
# to hold, so it must never be softened into something a headless target can satisfy.

id: apply_changes
verb: apply_changes
type: constitutive
realization_kind: gated-tool

binding_mode: pinned
context_requirements:
  - "an existing pinned semantic project that parses and has a successful build proof"
context_precondition:
  - { predicate: wren_project_exists }

params: []
llm_steps: []
trigger: { kind: one_shot }
guardrails:
  - { name: must_dry_run, locked: true }
  - { name: human_approval, locked: true }
  - { name: no_silent_overwrite, locked: true }
  - { name: context_write_authz, locked: true, scope: "enrichment-sinks" }
  - { name: rollback_available, locked: true }
required_capabilities:
  - context_write_authz
  - context_validate
  - context_build
  - version_control
  - human_approval
  - enrichment_apply:deterministic
borrowed_actions: []
effect:
  render_blocks: [diff, status]
  outcome:
    kind: mutation
    target: context
    change_type: context_enrichment
eval:
  template_ref: eval/
  metrics: [apply_safety, compliance]

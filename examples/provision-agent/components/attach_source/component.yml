# attach_source — the first half of the provisioning flow (see ../../profile.yml): point a new
# workspace at a data source it does not yet have.
#
# Structurally this is `type: analytical` + `realization_kind: skill` + `outcome.kind: none`, NOT
# constitutive/gated-tool. Dispatch keys on (realization_kind, outcome.kind, trigger.kind) rather
# than on id or verb, so this is an ordinary skill-family component that happens to be guarded by
# `setup_execution` instead of `read_only_execution`. Modeling it as constitutive/gated-tool would
# drag in `human_approval`, which is safety-critical and resolves `fail` on a headless target — a
# provisioning run has to complete without an approval channel, so it stays on the skill lifecycle
# and its side effects go through the guard instead.

id: attach_source
verb: attach_source
type: analytical
realization_kind: skill

binding_mode: runtime_selected
context_requirements:
  - "no pre-existing semantic project required — this component is what points a workspace at a source"
# No context_precondition: there is no existing semantic layer to probe at attach time, and that
# absence is the whole reason this fixture is bound to a raw source.

params: []

llm_steps:
  # One strong step. A single tier keeps the required capability `llm:strong` rather than
  # `llm:per_step_tier`, which is what the Setup contract's exact-capability check expects.
  - { name: attach, tier: strong, prompt_ref: steps/attach.md, produces: attachment_summary }
trigger: { kind: one_shot }
guardrails:
  # The setup enforcement point, scoped to the project root. It broadens Bash beyond a single tool
  # and permits Write/Edit inside that scope rather than denying outright — both still bounded by the
  # scope, and both still subject to the destructive/redirection denylist, which is never relaxed.
  - { name: setup_execution, locked: true, scope: "." }
required_capabilities:
  - source_connect
  - llm:strong
borrowed_actions: []

effect:
  render_blocks: []
  outcome:
    kind: none

eval:
  template_ref: eval/
  metrics: [attach_success]

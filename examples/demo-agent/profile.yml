# orders-analytics — a Warble profile (Harness + Context binding)
# Profile = mounts components + supplies binding/override + binds Context scope.

profile: orders-analytics

# ── Context binding (coarse: a whole wren project; no MDL introspection in this POC) ──
context:
  project: ./context/binding.yml        # indirection to the bound wren project (see context/binding.yml)

# ── Harness: mount components + supply binds + overrides ──
components:
  - use: generate_dashboard
    # Inherit topic_default: overview. The old config block was ignored.
    # To intentionally change it, use bind: { topic_default: "orders overview" }.

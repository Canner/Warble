# answer_query — analytical text-to-SQL component (eval substrate).
# Answers one data question through the semantic layer and returns a structured result set,
# so execution-based eval can compare results deterministically. Single llm_step → the tier
# binding IS the model, which is exactly what the Pareto ablation varies.

id: answer_query
verb: answer_query
type: analytical
realization_kind: skill

binding_mode: runtime_selected
context_requirements:
  - "a wren project (semantic layer) to query"
context_precondition:
  - { predicate: mdl_parseable }

params: []

llm_steps:
  - { name: answer, tier: strong, prompt_ref: steps/answer.md }
trigger: { kind: one_shot }
guardrails:
  - { name: read_only_execution, locked: true }
required_capabilities:
  - sql_execution:read_only
  - llm:strong

borrowed_actions: []

effect:
  render_blocks: [table]
  outcome:
    kind: none

eval:
  template_ref: eval/
  metrics: [execution_accuracy]

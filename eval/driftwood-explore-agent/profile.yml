# driftwood-explore — mounts the Hub's canonical explore_model over the driftwood wren project.
#
# Unlike examples/driftwood-agent (which carries its own local single-step answer_query override,
# a deliberate Pareto ablation substrate), this profile mounts NO local components/ — it resolves
# explore_model straight from hub/components/, i.e. the exact component genbi-default/profile.yml
# mounts. That is the point: a golden run against this profile is a golden run against
# genbi-default's real explore_model, not a lookalike.

profile: driftwood-explore

context:
  project: ./context/binding.yml

components:
  - use: explore_model

[package]
name = "warble-eval-compare"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Warble eval comparator: score a dispatched agent's tool-call trace / output against a golden expectation."
repository.workspace = true
readme = "../../README.md"
keywords = ["testing", "agent", "llm"]
categories = ["development-tools::testing"]

[[bin]]
name = "warble-eval-compare"
path = "src/main.rs"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[dev-dependencies]

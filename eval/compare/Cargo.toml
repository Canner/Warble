[package]
name = "warble-eval-compare"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Warble eval comparator: compare a result-set table against a golden expectation (scalar/set/ordered match, with tolerance)."
repository.workspace = true
readme = "../../README.md"
keywords = ["testing", "agent", "llm"]
categories = ["development-tools::testing"]

[[bin]]
name = "warble-eval-compare"
path = "src/main.rs"

# Published to crates.io (see RELEASING.md), but not part of the binary release surface: the
# GitHub Releases / installer / npm-wrapper / binstall story is for the `warble` CLI only.
[package.metadata.dist]
dist = false

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[dev-dependencies]

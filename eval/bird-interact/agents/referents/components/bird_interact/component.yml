# bird_interact -- a declared referent-discipline entry for the BIRD-Interact `a-interact` eval
# (../../../../README.md#bring-your-own-agent). It sits BESIDE agents/baseline and does not replace
# it: the baseline is the fixed reference every published number is measured against, and this
# profile is only meaningful reported as a pair with it.
#
# WHAT THIS PROFILE VARIES, AND WHAT IT DELIBERATELY DOES NOT
# The declared anatomy below is byte-identical to the baseline's -- same id, verb, type,
# realization_kind, binding_mode, params, one `strong` step named `solve`, same guardrails,
# capabilities and effect. The ONLY difference is the body of steps/solve.md. That is on purpose:
# the harness fixes the tool surface, the tier binding and the session shape, so the prompt is the
# only real lever, and holding everything else identical is what makes a difference in the score
# attributable to the declared policy rather than to composition structure. The step keeps the name
# `solve` for the same reason -- dispatch prepends a `## <step name>` header, so an identical name
# means an identical header and a prompt-body-only diff.
#
# WHERE THE POLICY COMES FROM
# The disciplines in steps/solve.md are carried over from the declared behaviour of an interactive
# analytical data agent -- an agent that answers ambiguous questions over someone else's semantic
# layer and must decide, per question, whether to resolve a term itself or put it to the user. Four
# of its declared behaviours transfer to this envelope, and each maps to one section of the prompt:
#
#   * Express a clarification as a schema-grounded condition, never as an English paraphrase of the
#     phrase being clarified.                        -> "Resolve referents before you compute"
#   * Resolve against the knowledge base and the schema FIRST, and put the question to the user only
#     when two or more schema-grounded readings survive and would return different rows.
#                                                    -> the three-place ordering in that section
#   * State the interpretation you settled on, as a one-line condition, rather than proceeding on an
#     unstated one.                                  -> the mapping form, and check 1 before submit
#   * Resolving a term is exempt from the pre-query thrift budget: reading to disambiguate is
#     expected before a clarification, not an overrun.
#                                                    -> "Spend asks on referents, not on arithmetic"
#   * Announcing an action is not performing it; the asking IS the tool call, emitted in the same
#     turn.                                          -> the closing rule of that same section
#   * Self-check before ending a turn, and treat an open phase as an unfinished task.
#                                                    -> "Verify before you spend a submit"; Mechanics
#
# WHY THOSE, AND NOT A BUDGET PLANNER
# The baseline's measured run in this package failed four of five tasks, and the per-task autopsy
# put every one of them on the same axis: the arithmetic the agent performed was right, and what it
# got wrong was WHICH THING IN THE DATABASE the question was about -- which column a phrase denoted,
# which entity was being counted, which conditions constituted a defined population, what boundary
# an unquantified word stood for. The clarification channel was not the constraint: every question
# it asked was answered. The questions were simply not aimed at the referents that decided the
# outcome. Budget exhaustion was downstream of repeated rejected submissions, not a cause, which is
# why this profile declares no budget planner and instead makes a submission the thing you must earn.
#
# WHAT WOULD MAKE THIS PROFILE'S NUMBER MEAN LESS THAN IT LOOKS
#   * The prompt is roughly five times the baseline's length, so length is a confound this pairing
#     cannot separate from policy. A run that improves on the baseline does not by itself establish
#     that the referent discipline is what improved it.
#   * Nothing here is tuned against the tasks: no task, table, column, defined term, threshold or
#     gold query appears in the prompt, and the disciplines are stated as disciplines. That is a
#     boundary requirement, not modesty -- a profile carrying the scored tasks' own content would
#     measure the tuning.
#   * Every tier binds to one model here, so any number this profile produces is a flattened-tier
#     measurement and has to be labelled as one.
id: bird_interact
verb: bird_interact
type: analytical
realization_kind: skill

# runtime_selected, not pinned: BIRD-Interact swaps the database per task, so no target can be
# git-static -- the harness resolves the wren project per `db_name` at session time.
binding_mode: runtime_selected
context_requirements:
  - "the BIRD-Interact runtime exposed through the benchmark's nine tools"
# No context_precondition: the bound context is `kind: external` (`bird-interact://runtime`, see
# ../../context/binding.yml), so there is no local MDL for the injected ContextLoader to probe --
# the schema lives behind `get_schema`, one of the CHARGED tools. Every predicate in the closed
# vocabulary is unanswerable here by construction, not merely left unchecked.
context_precondition: []

params:
  # Which model backs `strong` is a layer-3 runtime binding, never git-static: the eval varies it
  # across runs and the IR has to stay identical when it does.
  - { name: model_binding, source: runtime-injected }

llm_steps:
  # ONE step, on purpose. The entire a-interact strategy -- what each tool costs, when a lookup
  # earns its bird-coins, the phase-1 -> phase-2 continuation, the forced submit once the budget is
  # spent -- lives in steps/solve.md, NOT in composition structure (invariant #3: no DSL in the
  # composition layer). The multi-turn interrogation is the harness resuming the same SDK session,
  # not extra llm_steps.
  - { name: solve, tier: strong, prompt_ref: steps/solve.md, produces: submitted_sql }
# one_shot is the DISPATCH shape (one task = one session), not a bound on model turns.
trigger: { kind: one_shot }
guardrails:
  # A floor a profile cannot weaken -- but read carefully what it constrains HERE.
  #
  # It is NOT a filter on submitted SQL. Management tasks run normally: `execute_sql`/`submit_sql`
  # forward the statement to the official service unfiltered, and `isQueryLikeStatement`
  # (SELECT/WITH/EXPLAIN, ../../../../src/wren-planner.ts) only decides whether Wren PLANS it first --
  # a mutating statement skips planning and passes through unchanged. ../../../../src/report-build.ts
  # even warns when no Management task ran, since a-interact is only fully exercised with both
  # categories. Those mutations land on the official Postgres via the official DB service; Warble's
  # own process executes no SQL at all.
  #
  # It is also NOT the dispatcher's runtime `canUseTool` gate
  # (dispatcher/claude-agent-sdk/src/guardrails.ts). `DispatchPlan.options` is serializable and
  # excludes that callback by construction (dispatcher/claude-agent-sdk/src/options.ts); run.ts is
  # what attaches it, and this harness uses `prepareDispatch` plus its own `buildBirdAgentOptions`,
  # so the guard is never wired in.
  #
  # What actually holds the line is ../../../../src/agent.ts replacing the tool surface outright:
  # `tools: []`, `allowedTools` = the nine BIRD MCP tools, `disallowedTools` = Bash/Read/Write/Edit/
  # Glob/Grep/WebFetch/WebSearch. The agent gets no shell, no filesystem and no network -- only the
  # charged benchmark tools. That is the honest scope of this guardrail in this profile.
  - { name: read_only_execution, locked: true }
required_capabilities:
  # NOTE: per_step_tier is declared even though there is exactly one step -- the sibling single-step
  # eval component (eval/answer-agent/components/answer_query) omits it. Harmless for behavior, but
  # it does narrow which targets can accept this profile.
  - llm:per_step_tier
  - llm:strong
# Nothing borrowed: the nine tools are served by the benchmark's own MCP server
# (../../../../src/tools.ts), so they are context, not runtime actions Warble has to realize-via.
borrowed_actions: []

effect:
  # No render blocks and no outcome: the result of a task IS the `submit_sql` call, graded by the
  # official DB service (0.7 for phase 1, 0.3 for phase 2). That score belongs to BIRD, so this
  # component does not dress it up as a Warble outcome -- which is what makes it worth having.
  render_blocks: []
  outcome:
    kind: none

eval:
  # Declarative only: `template_ref` is carried into the IR verbatim (core/src/compile.rs) with no
  # path resolution, and nothing in this repo reads `bird_interact_reward` -- the authoritative
  # reward comes from the official scorer, not from Warble's eval runner.
  template_ref: eval/
  metrics: [bird_interact_reward]

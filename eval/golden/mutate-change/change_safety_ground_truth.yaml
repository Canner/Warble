# Synthetic change-safety-gate ground truth (Phase 4a — mutating guardrail).
#
# A fixed lineage graph plus the impact its owner reports over it, then a `cases:` list of gate
# decisions layered on top. Warble no longer computes a downstream closure — the layer's owner
# supplies one — so this file carries the `impact:` block directly, in the shape the prepared-context
# document's own analysis section uses (node id -> { downstream, severity { rank, name } }).
#
# The `impact:` values were generated from Warble's own traversal while it still existed, then
# committed, so they are not hand-authored guesses about reachability. They also agree with the
# per-case comments below, which were written independently.
#
# The policy the cases encode, in evaluation order:
#   1. empty radius                                             -> allow
#   2. seed or any downstream node is in `protected`            -> block
#   3. `max_severity` is set and severity rank > that rank      -> escalate
#   4. `max_downstream` is set and downstream.len() > max        -> escalate
#   5. otherwise                                                -> allow
#
# `eval/runner/tests/mutate_change.rs` runs an INDEPENDENT REIMPLEMENTATION of that policy over this
# data — not the production `cli::gate::decide`, which it cannot reach without a dependency cycle
# (`warble-cli` already depends on `warble-eval-runner`). So this eval scores the policy as specified
# here; it does NOT prove the shipped gate agrees with it. That gap is real and tracked separately.

graph:
  nodes:
    - { id: "model:orders", kind: Model }
    - { id: "model:customers", kind: Model }
    - { id: "rel:orders_customers", kind: Relationship }
    - { id: "cube:revenue", kind: Cube }
    - { id: "metric:revenue.total_revenue", kind: Metric }
    - { id: "metric:revenue.avg_order_value", kind: Metric }
    - { id: "dim:revenue.status", kind: Dimension }
    - { id: "dim:revenue.order_date", kind: Dimension }
    - { id: "view:orders_view", kind: View }
  edges:
    - { from: "model:orders", to: "rel:orders_customers" }
    - { from: "model:customers", to: "rel:orders_customers" }
    - { from: "model:orders", to: "cube:revenue" }
    - { from: "model:orders", to: "view:orders_view" }
    - { from: "cube:revenue", to: "metric:revenue.total_revenue" }
    - { from: "cube:revenue", to: "metric:revenue.avg_order_value" }
    - { from: "cube:revenue", to: "dim:revenue.status" }
    - { from: "cube:revenue", to: "dim:revenue.order_date" }

impact:
  "cube:revenue":
    severity: { rank: 3, name: semantic }
    downstream:
      - "dim:revenue.order_date"
      - "dim:revenue.status"
      - "metric:revenue.avg_order_value"
      - "metric:revenue.total_revenue"
  "metric:revenue.total_revenue":
    severity: { rank: 0, name: none }
    downstream: []
  "model:customers":
    severity: { rank: 1, name: compatibility }
    downstream:
      - "rel:orders_customers"
  "model:orders":
    severity: { rank: 3, name: semantic }
    downstream:
      - "cube:revenue"
      - "dim:revenue.order_date"
      - "dim:revenue.status"
      - "metric:revenue.avg_order_value"
      - "metric:revenue.total_revenue"
      - "rel:orders_customers"
      - "view:orders_view"

cases:
  # A leaf's radius is empty — nothing downstream to gate on, regardless of thresholds.
  - id: empty_radius_allows
    seed: "metric:revenue.total_revenue"
    max_severity_rank: null
    max_downstream: null
    protected: []
    expected_verdict: allow

  # model:orders' radius is semantic; capping at structural means semantic exceeds the ceiling.
  - id: severity_exceeds_max_escalates
    seed: "model:orders"
    max_severity_rank: 2
    max_downstream: null
    protected: []
    expected_verdict: escalate

  # Protection is checked before any threshold: touching a protected metric is a hard block even
  # with no severity/downstream limits configured.
  - id: protected_asset_blocks
    seed: "model:orders"
    max_severity_rank: null
    max_downstream: null
    protected: ["metric:revenue.total_revenue"]
    expected_verdict: block

  # model:customers' radius is only compatibility — within a structural ceiling, so it's allowed.
  - id: compatibility_within_structural_max_allows
    seed: "model:customers"
    max_severity_rank: 2
    max_downstream: null
    protected: []
    expected_verdict: allow

  # model:orders' downstream has 7 nodes; capping the count at 3 escalates even though no severity
  # ceiling is set.
  - id: downstream_count_exceeds_max_escalates
    seed: "model:orders"
    max_severity_rank: null
    max_downstream: 3
    protected: []
    expected_verdict: escalate

  # cube:revenue's radius (4 nodes, semantic) sits within generous limits on both axes, and nothing
  # is protected, so it's allowed.
  - id: within_all_limits_allows
    seed: "cube:revenue"
    max_severity_rank: 3
    max_downstream: 10
    protected: []
    expected_verdict: allow

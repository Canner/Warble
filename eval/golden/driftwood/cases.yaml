# Driftwood golden eval cases (53) — warble eval-runner format. v2 (2026-07-10).
# Ground truth = RESULT SETS, hand-authored truth SQL computed against the frozen seed-42
# driftwood.duckdb. v2 recalibration: every truth now applies the project's OWN canonical
# knowledge rules uniformly — test-account exclusion on every business metric, UTC
# reporting timezone (incl. legacy-only questions), units-sold excludes cancelled orders.
# (The v1 pilot showed the stronger model following those rules and being marked wrong —
# the judge must obey its own laws.)
# match: scalar (single value) | set (unordered rows) | ordered (rank-sensitive).
dataset: driftwood
context_version: driftwood@seed42-v2

cases:
  # ── easy floor ──────────────────────────────────────────────────────────
  - id: g01_active_products
    question: "How many products are currently active (not discontinued)?"
    tags: [easy]
    match: scalar
    expected: { columns: [active_products], rows: [[527]] }

  - id: g02_orders_2025
    question: "How many orders were placed on the new platform in calendar 2025?"
    tags: [easy, time-filter, test-and-deleted]
    match: scalar
    expected: { columns: [order_count], rows: [[16804]] }

  - id: g15_camping_products
    question: "How many products are in the Camping top-level category?"
    tags: [easy, string-filter]
    match: scalar
    expected: { columns: [camping_products], rows: [[60]] }

  - id: g16_canceled_subscriptions
    question: "How many Driftwood+ subscriptions have been canceled?"
    tags: [easy, test-and-deleted]
    match: scalar
    expected: { columns: [canceled], rows: [[863]] }

  - id: g17_top3_products_by_units
    question: "Which three products have sold the most units on the new platform, and how many units each?"
    tags: [multi-join, test-and-deleted]
    match: ordered
    expected:
      columns: [product, units]
      rows:
        - ["Bike Alpine 226", 586]
        - ["Paddle Classic 269", 572]
        - ["Boot Explorer 135", 557]

  - id: g42_top3_categories_2025
    question: "What were the top 3 product categories by units sold in 2025, in order?"
    tags: [multi-join, test-and-deleted]
    match: ordered
    expected:
      columns: [category, units]
      rows:
        - ["Fitness > Mats", 3754]
        - ["Hunting > Rifle Cases", 3418]
        - ["Running > Shoes", 3387]

  - id: g44_fast_churn_2024
    question: "How many subscriptions started in 2024 were canceled within 90 days of starting?"
    tags: [easy, time-filter]
    match: scalar
    expected: { columns: [fast_churn], rows: [[28]] }

  # ── T1/T2 cross-system union + dedup ────────────────────────────────────
  - id: g03_total_orders_all_time
    question: "How many orders have we received in total, across both the legacy and the new platform, all time?"
    tags: [cross-system-union, dedup-migration]
    match: scalar
    expected: { columns: [total_orders], rows: [[100994]] }

  - id: g18_orders_2020
    question: "How many orders did we receive in calendar 2020?"
    tags: [cross-system-union, timezone]
    match: scalar
    expected: { columns: [order_count], rows: [[9566]] }

  - id: g19_migrated_copies
    question: "How many rows in the new platform's orders table are migrated copies of legacy orders?"
    tags: [dedup-migration]
    match: scalar
    expected: { columns: [migrated], rows: [[2826]] }

  - id: g20_all_time_order_value_usd
    question: "What is the total order value in USD across both platforms, all time, excluding cancelled orders?"
    tags: [cross-system-union, dedup-migration, unit-cents, currency]
    match: scalar
    tolerance: { numeric: 1.0 }
    expected: { columns: [total_usd], rows: [[30354844.00]] }

  # ── T3 unit-cents ────────────────────────────────────────────────────────
  - id: g04_legacy_revenue_2019_2022
    question: "What was the total legacy-platform order value in USD for 2019 through 2022, excluding cancelled orders?"
    tags: [unit-cents, timezone]
    match: scalar
    tolerance: { numeric: 0.01 }
    expected: { columns: [legacy_usd], rows: [[11327888.20]] }

  - id: g21_avg_legacy_order_value
    question: "What was the average legacy order value in USD?"
    tags: [unit-cents]
    match: scalar
    tolerance: { numeric: 0.01 }
    expected: { columns: [avg_usd], rows: [[319.52]] }

  # ── T4/T5/T11 revenue semantics + currency ──────────────────────────────
  - id: g07_gross_captured_usd_2025
    question: "What was our total gross captured payment volume in USD for calendar 2025?"
    tags: [same-name-diff-meaning, refund-double-count, currency]
    match: scalar
    tolerance: { numeric: 1.0 }
    expected: { columns: [gross_usd], rows: [[4735356.82]] }

  - id: g22_processor_fees_2025
    question: "How much did we pay in payment-processor fees in 2025, in USD?"
    tags: [same-name-diff-meaning, currency]
    match: scalar
    tolerance: { numeric: 1.0 }
    expected: { columns: [fees_usd], rows: [[141723.50]] }

  - id: g23_refunded_2025_usd
    question: "How much money was refunded to customers in 2025, in USD?"
    tags: [refund-double-count, currency]
    match: scalar
    tolerance: { numeric: 1.0 }
    expected: { columns: [refunds_usd], rows: [[267919.19]] }

  - id: g24_net_revenue_2025_usd
    question: "What was our net recognized revenue for calendar 2025 in USD (gross captured payments minus refunds)?"
    tags: [same-name-diff-meaning, refund-double-count, currency]
    match: scalar
    tolerance: { numeric: 2.0 }
    expected: { columns: [net_usd], rows: [[4467437.63]] }

  # ── T6 test/deleted exclusions ──────────────────────────────────────────
  - id: g05_active_customers
    question: "How many active customers do we have on the new platform?"

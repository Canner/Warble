# Coarse context binding: the whole jaffle-wren semantic layer. Since IR v0.3 the front-end builds a
# real MdlContext over the bound project and evaluates context_precondition predicates against it —
# it does introspect MDL (see cli/src/lib.rs::resolve_context, docs/spec/ir-schema.md). The binding
# stays "coarse" in a different sense: it names the whole project, not a specific metric/grain.
# Path is relative to this Warble project dir (genbi-default/).
project: ../examples/jaffle-wren

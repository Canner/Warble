# genbi-default — the flagship GenBI profile (Phase 1.2 / roadmap G7 entry).
#
# Mounts the four consuming GenBI components as a single git-authoritative behavior surface, bound to
# one semantic context. The components themselves live in the shared Hub (hub/components/<id>/); this
# profile mounts them by id and does not own its own component library. demo-agent/ and
# eval/answer-agent/ keep their own minimal component copies as compiler/eval fixtures and are
# intentionally left untouched.

profile: genbi-default

context:
  project: ./context/binding.yml

config:
  tier_policy: cost_sensitive

components:
  - use: explore_model
  - use: answer_query
  - use: generate_dashboard
  - use: explain_change

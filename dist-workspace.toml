[workspace]
members = ["cargo:."]

# Config for 'dist'
[dist]
# The preferred dist version to use in CI (Cargo.toml SemVer syntax)
cargo-dist-version = "0.32.0"
# CI backends to support
ci = "github"
# The installers to generate for each app
installers = ["shell", "npm"]
# Scope to prefix npm packages with (required by the npm installer)
npm-scope = "@warble"
# Target platforms to build apps for (Rust target-triple syntax)
targets = ["aarch64-apple-darwin", "aarch64-unknown-linux-gnu", "x86_64-apple-darwin", "x86_64-unknown-linux-gnu"]
# Path that installers should place binaries in
install-path = "CARGO_HOME"
# Where to host releases
hosting = "github"
# Whether to install an updater program
install-updater = false

# Third-party actions in the generated release.yml are pinned to commit SHAs (not floating
# tags), matching ci.yml's convention, since this workflow runs on a soon-public repo where a
# mutable tag is a supply-chain hole. Available since cargo-dist 0.29.0: this makes `dist
# generate`/`dist plan` reproduce the pin natively, so there's no drift to suppress and no
# need for `allow-dirty`.
[dist.github-action-commits]
"actions/checkout" = "3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1"
"actions/upload-artifact" = "043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1"
"actions/download-artifact" = "3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1"

# Coarse context binding: the whole jaffle-wren semantic layer — same shape and same resolution path
# as genbi-default/context/binding.yml (IR v0.3+ builds a real MdlContext over the bound project and
# evaluates context_precondition predicates against it; see cli/src/lib.rs::resolve_context,
# docs/spec/ir-schema.md). The host rewrites this `project:` line to the user's own wren project at
# onboarding time; this repo pins jaffle-wren so `genbi-monitor` compiles standalone for CI/dev.
# Path is relative to this Warble project dir (genbi-monitor/).
project: ../examples/jaffle-wren
